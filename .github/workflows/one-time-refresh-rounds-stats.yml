name: One-time rounds and statistics refresh fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-refresh-rounds-stats.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch index.html safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'CBO 4.6.x page-open refresh' in s:
              raise SystemExit('Refresh fix already present; refusing duplicate patch.')
          old='''function showPage(id,btn){
 const target=document.getElementById(id);
 if(!target) return;
 if(id==='tour'){
   const frame=document.getElementById('onTourMemberFrame');
   if(frame&&!frame.dataset.loaded){frame.src=frame.dataset.src;frame.dataset.loaded='1';}
 }
 document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p===target));'''
          new='''function showPage(id,btn){
 const target=document.getElementById(id);
 if(!target) return;
 if(id==='tour'){
   const frame=document.getElementById('onTourMemberFrame');
   if(frame&&!frame.dataset.loaded){frame.src=frame.dataset.src;frame.dataset.loaded='1';}
 }
 // CBO 4.6.x page-open refresh: render data-dependent views when actually opened.
 // This avoids a stale/empty first render if live/auth data became ready after initial renderAll().
 if(id==='rounds') renderRounds();
 if(id==='statistics') cboLoadSeasonStats().catch(()=>{});
 document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p===target));'''
          if s.count(old)!=1:
              raise SystemExit(f'Expected exactly one showPage marker, found {s.count(old)}. No change made.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit isolated refresh fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh rounds and statistics on page open"
          git push origin HEAD:main
