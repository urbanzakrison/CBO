name: CBO Winter Health
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cbo-winter-health.yml'
      - 'ops/**'
      - 'docs/WINTER_OPERATIONS_V1.md'
permissions:
  contents: read
concurrency:
  group: winter-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  health:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'urbanzakrison/CBO' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Read-only frontend and database health
        env:
          CBO_HEALTH_REPORT: ${{ runner.temp }}/cbo-health.json
        run: node ops/winter-health.mjs
      - name: Opt-in independent success heartbeat (schedule only)
        if: success() && github.event_name == 'schedule'
        env:
          CBO_HEALTH_REPORT: ${{ runner.temp }}/cbo-health.json
          CBO_HEALTHCHECKS_ENABLED: ${{ vars.CBO_HEALTHCHECKS_ENABLED }}
          CBO_HEALTHCHECKS_PING_URL: ${{ secrets.CBO_HEALTHCHECKS_PING_URL }}
        run: node ops/winter-heartbeat.mjs
  isolated-qa:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'urbanzakrison/CBO' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Offline fault, timeout, retry and log-safety tests
        env:
          CBO_WINTER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node --test ops/winter-health.test.mjs ops/winter-heartbeat.test.mjs
      - name: One legitimate read-only live QA check
        run: node ops/winter-health.mjs
