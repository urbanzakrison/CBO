name: One-time restore verified login field

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-restore-login-field.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore verified Golf-ID field
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<label>Golf-ID / profil</label><input id="loginGolfId" inputmode="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Golf-ID eller profil" maxlength="32">'
          new='<label>Golf-ID</label><input id="loginGolfId" inputmode="numeric" autocomplete="username" placeholder="XXXXXX-XXX" maxlength="10">'
          if s.count(old)!=1:
              raise SystemExit(f'Expected one modified login field, found {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit isolated login field restore
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore verified Golf-ID login field"
          git push origin HEAD:main
