name: Season QA (free public runner)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/season-qa.yml'
      - 'tests/**'
      - '22_season_management_v1.sql'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: season-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  postgres-concurrency:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: cbo_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Real PostgreSQL independent-session concurrency tests
        env:
          CBO_QA_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/cbo_qa
        run: node tests/season-postgres-qa.mjs
