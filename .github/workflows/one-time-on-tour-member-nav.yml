name: One-time On Tour member navigation integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-on-tour-member-nav.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch index.html safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          if 'id="onTourMemberFrame"' in s or 'data-page="tour"' in s:
              raise SystemExit('On Tour member navigation already exists; refusing duplicate patch.')

          grid='grid-template-columns:repeat(5,1fr)'
          if s.count(grid)!=1:
              raise SystemExit(f'Expected one 5-column nav grid, found {s.count(grid)}. No change made.')
          s=s.replace(grid,'grid-template-columns:repeat(6,1fr)',1)

          main_marker=''' </main>\n\n <nav class="nav" aria-label="Huvudmeny">'''
          tour_section=''' <section id="tour" class="page" aria-label="On Tour">\n  <iframe id="onTourMemberFrame" data-src="on-tour.html" title="CBO On Tour" loading="lazy" style="display:block;width:100%;height:calc(100vh - 105px);min-height:680px;border:0;border-radius:16px;background:transparent"></iframe>\n </section>\n </main>\n\n <nav class="nav" aria-label="Huvudmeny">'''
          if s.count(main_marker)!=1:
              raise SystemExit(f'Expected one main/nav marker, found {s.count(main_marker)}. No change made.')
          s=s.replace(main_marker,tour_section,1)

          nav_old='''  <button type="button" data-page="rounds"><b>⛳</b>Omgångar</button>\n  <button type="button" data-page="statistics"><b>📊</b>Statistik</button>'''
          nav_new='''  <button type="button" data-page="rounds"><b>⛳</b>Omgångar</button>\n  <button type="button" data-page="tour"><b>✈️</b>On Tour</button>\n  <button type="button" data-page="statistics"><b>📊</b>Statistik</button>'''
          if s.count(nav_old)!=1:
              raise SystemExit('Navigation marker missing or duplicated. No change made.')
          s=s.replace(nav_old,nav_new,1)

          show_old='''function showPage(id,btn){\n const target=document.getElementById(id);\n if(!target) return;\n document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p===target));'''
          show_new='''function showPage(id,btn){\n const target=document.getElementById(id);\n if(!target) return;\n if(id==='tour'){\n   const frame=document.getElementById('onTourMemberFrame');\n   if(frame&&!frame.dataset.loaded){frame.src=frame.dataset.src;frame.dataset.loaded='1';}\n }\n document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p===target));'''
          if s.count(show_old)!=1:
              raise SystemExit('showPage marker missing or duplicated. No change made.')
          s=s.replace(show_old,show_new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit isolated member navigation integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate On Tour into member navigation"
          git push origin HEAD:main
