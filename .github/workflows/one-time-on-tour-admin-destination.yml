name: One-time On Tour admin destination patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-on-tour-admin-destination.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch index.html safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="adminImportDestinationSelect"' in s:
              raise SystemExit('Destination selector already exists; refusing duplicate patch.')

          marker = '''<div class="card"><div class="cardhead"><div><h2>Inloggning</h2><div id="signedInAs" class="sub">Inloggad</div></div><span class="badge">ADMIN</span></div><button class="secondary" onclick="cboLogout()">Logga ut</button></div>\n   <div class="card">\n    <div class="cardhead"><h2>Ny omgång</h2><span class="badge">ADMIN</span></div>'''

          replacement = '''<div class="card"><div class="cardhead"><div><h2>Inloggning</h2><div id="signedInAs" class="sub">Inloggad</div></div><span class="badge">ADMIN</span></div><button class="secondary" onclick="cboLogout()">Logga ut</button></div>\n\n   <div class="card" id="adminImportDestinationCard">\n    <div class="cardhead"><div><h2>Importdestination</h2><div class="sub">Välj vart nästa GameBook-import ska publiceras.</div></div><span class="badge">ADMIN</span></div>\n    <label for="adminImportDestinationSelect">Destination</label>\n    <select id="adminImportDestinationSelect" onchange="cboAdminImportDestinationChanged(this.value)">\n      <option value="cbo" selected>CBO-omgång</option>\n      <option value="tour">On Tour</option>\n    </select>\n    <div id="adminImportDestinationHelp" class="notice" style="margin-top:10px"><strong>CBO-omgång är förvald.</strong><br>Den befintliga CBO-importen och publiceringen används oförändrad.</div>\n   </div>\n\n   <div id="onTourAdminPanel" class="card hidden" style="border-left:5px solid #2c7773">\n    <div class="cardhead"><div><h2>On Tour</h2><div class="sub">Separat importflöde för golfresor och tävlingar utanför ordinarie CBO-serie.</div></div><span class="badge" style="background:#dcefed;color:#165d59">ON TOUR</span></div>\n    <div class="notice" style="margin-top:10px"><strong>On Tour-import förbereds.</strong><br>Ingen bildtolkning eller publicering är ansluten i detta steg. Den ordinarie CBO-importen påverkas inte.</div>\n   </div>\n\n   <div class="card">\n    <div class="cardhead"><h2>Ny omgång</h2><span class="badge">ADMIN</span></div>'''

          if s.count(marker) != 1:
              raise SystemExit(f'Expected exactly one admin marker, found {s.count(marker)}. No change made.')
          s = s.replace(marker, replacement, 1)

          script_marker = '</body>'
          script = '''\n<script id="onTourAdminDestinationScript">\nfunction cboAdminImportDestinationChanged(value){\n  const selected=value==='tour'?'tour':'cbo';\n  const tour=document.getElementById('onTourAdminPanel');\n  const gb=document.getElementById('gamebookImportBox');\n  const cboCard=gb?gb.closest('.card'):null;\n  const help=document.getElementById('adminImportDestinationHelp');\n  if(tour)tour.classList.toggle('hidden',selected!=='tour');\n  if(cboCard)cboCard.classList.toggle('hidden',selected==='tour');\n  if(help){\n    help.innerHTML=selected==='tour'\n      ? '<strong>On Tour valt.</strong><br>On Tour får ett separat import- och publiceringsflöde. Ingen CBO-data skrivs från den grenen.'\n      : '<strong>CBO-omgång är förvald.</strong><br>Den befintliga CBO-importen och publiceringen används oförändrad.';\n  }\n}\n</script>\n'''
          if script_marker not in s:
              raise SystemExit('Missing </body>; no change made.')
          s = s.replace(script_marker, script + script_marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit isolated UI change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add isolated On Tour admin destination selector"
          git push origin HEAD:main
