name: One-time On Tour new event default patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-on-tour-new-event-default.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch index.html safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_panel='''   <div id="onTourAdminPanel" class="card hidden" style="border-left:5px solid #2c7773">\n    <div class="cardhead"><div><h2>On Tour</h2><div class="sub">Separat importflöde för golfresor och tävlingar utanför ordinarie CBO-serie.</div></div><span class="badge" style="background:#dcefed;color:#165d59">ON TOUR</span></div>\n    <label for="onTourAdminEventSelect">Event</label>\n    <select id="onTourAdminEventSelect" disabled>\n      <option value="">Välj On Tour-event…</option>\n    </select>\n    <div id="onTourAdminEventStatus" class="notice" style="margin-top:10px"><strong>Event hämtas först när On Tour väljs.</strong><br>Listan läses via CBO:s befintliga On Tour-RPC och skriver ingen data.</div>\n    <div class="notice" style="margin-top:10px"><strong>Nästa steg:</strong><br>När eventvalet är verifierat kopplas separat runda, bildtolkning och publicering på här. Den ordinarie CBO-importen påverkas inte.</div>\n   </div>'''

          new_panel='''   <div id="onTourAdminPanel" class="card hidden" style="border-left:5px solid #2c7773">\n    <div class="cardhead"><div><h2>On Tour</h2><div class="sub">Separat importflöde för golfresor och tävlingar utanför ordinarie CBO-serie.</div></div><span class="badge" style="background:#dcefed;color:#165d59">ON TOUR</span></div>\n\n    <label for="onTourEventMode">Event</label>\n    <select id="onTourEventMode" onchange="cboAdminTourEventModeChanged(this.value)">\n      <option value="new" selected>Nytt event</option>\n      <option value="existing">Befintligt event</option>\n    </select>\n\n    <div id="onTourNewEventFields">\n      <label for="onTourNewEventName">Eventnamn</label>\n      <input id="onTourNewEventName" type="text" maxlength="120" placeholder="Exempel: Marbella Tour 2027">\n      <label for="onTourNewEventYear">År</label>\n      <input id="onTourNewEventYear" type="number" min="1900" max="2200">\n      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">\n        <div><label for="onTourNewEventStart">Startdatum</label><input id="onTourNewEventStart" type="date"></div>\n        <div><label for="onTourNewEventEnd">Slutdatum</label><input id="onTourNewEventEnd" type="date"></div>\n      </div>\n      <label for="onTourNewEventLocation">Plats</label>\n      <input id="onTourNewEventLocation" type="text" maxlength="160" placeholder="Valfritt">\n      <button id="onTourCreateEventBtn" class="primary" type="button" onclick="cboAdminCreateTourEvent()">Skapa On Tour-event</button>\n    </div>\n\n    <div id="onTourExistingEventFields" class="hidden">\n      <label for="onTourAdminEventSelect">Befintligt event</label>\n      <select id="onTourAdminEventSelect" disabled>\n        <option value="">Välj On Tour-event…</option>\n      </select>\n    </div>\n\n    <div id="onTourAdminEventStatus" class="notice" style="margin-top:10px"><strong>Nytt event är standard.</strong><br>Skapa eventet först. Därefter lägger vi en eller flera rundor under samma event.</div>\n    <div class="notice" style="margin-top:10px"><strong>Skyddad separation:</strong><br>On Tour använder endast cbo_tour_* och påverkar inte CBO-poäng, närvaro, statistik eller leaderboard.</div>\n   </div>'''

          if s.count(old_panel)!=1:
              raise SystemExit(f'Expected one current On Tour panel, found {s.count(old_panel)}. No change made.')
          s=s.replace(old_panel,new_panel,1)

          start=s.find('<script id="onTourAdminDestinationScript">')
          end=s.find('</script>',start)
          if start<0 or end<0:
              raise SystemExit('On Tour admin script not found. No change made.')
          end+=len('</script>')

          new_script='''<script id="onTourAdminDestinationScript">\nlet CBO_TOUR_ADMIN_EVENTS_LOADED=false;\nlet CBO_TOUR_ADMIN_ACTIVE_EVENT_ID=null;\n\nfunction cboAdminTourSetStatus(html){\n  const status=document.getElementById('onTourAdminEventStatus');\n  if(status)status.innerHTML=html;\n}\n\nfunction cboAdminTourEventModeChanged(value){\n  const mode=value==='existing'?'existing':'new';\n  document.getElementById('onTourNewEventFields')?.classList.toggle('hidden',mode!=='new');\n  document.getElementById('onTourExistingEventFields')?.classList.toggle('hidden',mode!=='existing');\n  CBO_TOUR_ADMIN_ACTIVE_EVENT_ID=null;\n  if(mode==='existing'){\n    cboAdminTourSetStatus('<strong>Befintligt event valt.</strong><br>Använd detta bara för att lägga till fler rundor i ett redan skapat event eller för historisk komplettering.');\n    cboAdminLoadTourEvents();\n  }else{\n    cboAdminTourSetStatus('<strong>Nytt event är standard.</strong><br>Skapa eventet först. Därefter lägger vi en eller flera rundor under samma event.');\n  }\n}\n\nasync function cboAdminLoadTourEvents(force=false){\n  const select=document.getElementById('onTourAdminEventSelect');\n  if(!select)return;\n  if(CBO_TOUR_ADMIN_EVENTS_LOADED&&!force)return;\n  if(!window.CBO_SUPABASE_CLIENT){cboAdminTourSetStatus('<strong>Kan inte hämta event.</strong><br>Supabase-klienten saknas.');return;}\n  select.disabled=true;\n  cboAdminTourSetStatus('<strong>Hämtar On Tour-event…</strong>');\n  try{\n    const {data,error}=await window.CBO_SUPABASE_CLIENT.rpc('cbo_tour_events_feed');\n    if(error)throw error;\n    const rows=Array.isArray(data)?data:[];\n    select.replaceChildren();\n    const first=document.createElement('option');first.value='';first.textContent='Välj On Tour-event…';select.appendChild(first);\n    rows.forEach(e=>{const opt=document.createElement('option');opt.value=String(e.id||'');opt.textContent=`${e.name||'On Tour-event'}${e.event_year?` · ${e.event_year}`:''}`;select.appendChild(opt);});\n    select.disabled=rows.length===0;\n    CBO_TOUR_ADMIN_EVENTS_LOADED=true;\n    cboAdminTourSetStatus(rows.length?`<strong>${rows.length} event hittades.</strong><br>Välj bara ett tidigare event om nästa runda faktiskt hör till det.`:'<strong>Inga tidigare On Tour-event hittades.</strong>');\n  }catch(e){\n    select.disabled=true;\n    cboAdminTourSetStatus(`<strong>Event kunde inte hämtas.</strong><br>${String(e?.message||e)}`);\n  }\n}\n\nasync function cboAdminCreateTourEvent(){\n  const btn=document.getElementById('onTourCreateEventBtn');\n  const name=(document.getElementById('onTourNewEventName')?.value||'').trim();\n  const year=Number(document.getElementById('onTourNewEventYear')?.value);\n  const starts=document.getElementById('onTourNewEventStart')?.value||null;\n  const ends=document.getElementById('onTourNewEventEnd')?.value||null;\n  const location=(document.getElementById('onTourNewEventLocation')?.value||'').trim()||null;\n  if(!name){cboAdminTourSetStatus('<strong>Eventnamn saknas.</strong>');return;}\n  if(!Number.isInteger(year)||year<1900||year>2200){cboAdminTourSetStatus('<strong>Kontrollera eventåret.</strong>');return;}\n  if(starts&&Number(starts.slice(0,4))!==year){cboAdminTourSetStatus('<strong>Startdatum och eventår måste vara samma år.</strong>');return;}\n  if(ends&&Number(ends.slice(0,4))!==year){cboAdminTourSetStatus('<strong>Slutdatum och eventår måste vara samma år.</strong>');return;}\n  if(starts&&ends&&ends<starts){cboAdminTourSetStatus('<strong>Slutdatum kan inte vara före startdatum.</strong>');return;}\n  if(!window.CBO_SUPABASE_CLIENT){cboAdminTourSetStatus('<strong>Supabase-klienten saknas.</strong>');return;}\n  if(btn)btn.disabled=true;\n  cboAdminTourSetStatus('<strong>Skapar On Tour-event…</strong>');\n  try{\n    const {data,error}=await window.CBO_SUPABASE_CLIENT.rpc('cbo_tour_admin_create_event',{p_name:name,p_event_year:year,p_starts_on:starts,p_ends_on:ends,p_location:location,p_notes:null});\n    if(error)throw error;\n    if(!data?.ok)throw new Error(data?.error||'Eventet kunde inte skapas.');\n    if(data.reused===true){\n      CBO_TOUR_ADMIN_ACTIVE_EVENT_ID=null;\n      cboAdminTourSetStatus('<strong>Ett event med samma namn och år finns redan.</strong><br>Inget nytt event skapades. Välj Befintligt event eller ändra namn/år.');\n      CBO_TOUR_ADMIN_EVENTS_LOADED=false;\n      return;\n    }\n    CBO_TOUR_ADMIN_ACTIVE_EVENT_ID=String(data.event_id||'');\n    CBO_TOUR_ADMIN_EVENTS_LOADED=false;\n    cboAdminTourSetStatus(`<strong>Event skapat ✓</strong><br>${name} · ${year}. Nästa steg är att skapa Runda 1 under detta event.`);\n  }catch(e){\n    CBO_TOUR_ADMIN_ACTIVE_EVENT_ID=null;\n    cboAdminTourSetStatus(`<strong>Event kunde inte skapas.</strong><br>${String(e?.message||e)}`);\n  }finally{if(btn)btn.disabled=false;}\n}\n\nfunction cboAdminImportDestinationChanged(value){\n  const selected=value==='tour'?'tour':'cbo';\n  const tour=document.getElementById('onTourAdminPanel');\n  const gb=document.getElementById('gamebookImportBox');\n  const cboCard=gb?gb.closest('.card'):null;\n  const help=document.getElementById('adminImportDestinationHelp');\n  if(tour)tour.classList.toggle('hidden',selected!=='tour');\n  if(cboCard)cboCard.classList.toggle('hidden',selected==='tour');\n  if(help){\n    help.innerHTML=selected==='tour'\n      ? '<strong>On Tour valt.</strong><br>Nytt event är standard. On Tour har separat import- och publiceringsflöde och skriver ingen CBO-data.'\n      : '<strong>CBO-omgång är förvald.</strong><br>Den befintliga CBO-importen och publiceringen används oförändrad.';\n  }\n  if(selected==='tour'){\n    const yearInput=document.getElementById('onTourNewEventYear');\n    if(yearInput&&!yearInput.value)yearInput.value=String(new Date().getFullYear());\n    cboAdminTourEventModeChanged(document.getElementById('onTourEventMode')?.value||'new');\n  }\n}\n</script>'''

          s=s[:start]+new_script+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit isolated On Tour event creation flow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make new On Tour event the default admin flow"
          git push origin HEAD:main
