name: One-time On Tour round draft patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-on-tour-round-draft.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch index.html safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          if 'id="onTourRoundDraftFields"' in s:
              raise SystemExit('Round draft UI already exists; refusing duplicate patch.')

          panel_marker='''    <div id="onTourAdminEventStatus" class="notice" style="margin-top:10px"><strong>Nytt event är standard.</strong><br>Skapa eventet först. Därefter lägger vi en eller flera rundor under samma event.</div>\n    <div class="notice" style="margin-top:10px"><strong>Skyddad separation:</strong><br>On Tour använder endast cbo_tour_* och påverkar inte CBO-poäng, närvaro, statistik eller leaderboard.</div>'''

          panel_replacement='''    <div id="onTourAdminEventStatus" class="notice" style="margin-top:10px"><strong>Nytt event är standard.</strong><br>Skapa eventet först. Därefter lägger vi en eller flera rundor under samma event.</div>\n\n    <div id="onTourRoundDraftFields" class="hidden" style="margin-top:14px;padding-top:12px;border-top:1px solid #d8c9aa">\n      <div class="cardhead"><div><h3 style="margin:0">Ny On Tour-runda</h3><div id="onTourRoundEventLabel" class="sub">Aktivt event</div></div><span class="badge" style="background:#dcefed;color:#165d59">RUNDA</span></div>\n      <div style="display:grid;grid-template-columns:90px 1fr;gap:8px">\n        <div><label for="onTourRoundNo">Runda</label><input id="onTourRoundNo" type="number" min="1" value="1"></div>\n        <div><label for="onTourRoundDate">Datum</label><input id="onTourRoundDate" type="date"></div>\n      </div>\n      <label for="onTourRoundCourse">Bana</label>\n      <input id="onTourRoundCourse" type="text" maxlength="160" placeholder="Golfbana">\n      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">\n        <div><label for="onTourRoundHoles">Hål</label><select id="onTourRoundHoles"><option value="18" selected>18 hål</option><option value="9">9 hål</option></select></div>\n        <div><label for="onTourRoundType">Rondtyp</label><select id="onTourRoundType" onchange="cboAdminTourRoundTypeChanged(this.value)"><option value="individual" selected>Individuell</option><option value="scramble">Scramble</option><option value="team">Lag</option><option value="other">Övrig</option></select></div>\n      </div>\n      <div id="onTourPrimaryMetricWrap">\n        <label for="onTourPrimaryMetric">Primär tävlingsform</label>\n        <select id="onTourPrimaryMetric">\n          <option value="">Välj tävlingsform…</option>\n          <option value="stroke_net">Slagspel NET</option>\n          <option value="stableford_net">Poängbogey NET</option>\n          <option value="stroke_scr">Slagspel SCR</option>\n          <option value="stableford_scr">Poängbogey SCR</option>\n        </select>\n        <div class="sub" style="margin-top:5px">Vid GameBook-import ska primär tävlingsform stämma med den tävlingsform som ligger längst till vänster på resultatkortet.</div>\n      </div>\n      <label for="onTourRoundTitle">Rundnamn</label>\n      <input id="onTourRoundTitle" type="text" maxlength="120" placeholder="Valfritt, t.ex. Runda 1">\n      <button id="onTourPrepareRoundBtn" class="primary" type="button" onclick="cboAdminPrepareTourRound()">Förbered runda</button>\n      <div id="onTourRoundStatus" class="notice" style="margin-top:10px"><strong>Ingen runda förberedd ännu.</strong><br>Rundan sparas inte i databasen förrän resultat senare granskas och publiceras.</div>\n    </div>\n\n    <div class="notice" style="margin-top:10px"><strong>Skyddad separation:</strong><br>On Tour använder endast cbo_tour_* och påverkar inte CBO-poäng, närvaro, statistik eller leaderboard.</div>'''

          if s.count(panel_marker)!=1:
              raise SystemExit(f'Expected exactly one panel marker, found {s.count(panel_marker)}. No change made.')
          s=s.replace(panel_marker,panel_replacement,1)

          var_marker='''let CBO_TOUR_ADMIN_EVENTS_LOADED=false;\nlet CBO_TOUR_ADMIN_ACTIVE_EVENT_ID=null;'''
          var_replacement='''let CBO_TOUR_ADMIN_EVENTS_LOADED=false;\nlet CBO_TOUR_ADMIN_ACTIVE_EVENT_ID=null;\nlet CBO_TOUR_ADMIN_ACTIVE_EVENT_NAME=null;\nlet CBO_TOUR_ADMIN_ACTIVE_EVENT_YEAR=null;\nlet CBO_TOUR_ADMIN_ROUND_DRAFT=null;'''
          if s.count(var_marker)!=1:
              raise SystemExit('On Tour state marker missing or duplicated. No change made.')
          s=s.replace(var_marker,var_replacement,1)

          helper_marker='''function cboAdminTourSetStatus(html){\n  const status=document.getElementById('onTourAdminEventStatus');\n  if(status)status.innerHTML=html;\n}\n'''
          helper_replacement='''function cboAdminTourSetStatus(html){\n  const status=document.getElementById('onTourAdminEventStatus');\n  if(status)status.innerHTML=html;\n}\n\nfunction cboAdminTourResetRoundDraft(){\n  CBO_TOUR_ADMIN_ROUND_DRAFT=null;\n  document.getElementById('onTourRoundDraftFields')?.classList.add('hidden');\n  const status=document.getElementById('onTourRoundStatus');\n  if(status)status.innerHTML='<strong>Ingen runda förberedd ännu.</strong><br>Rundan sparas inte i databasen förrän resultat senare granskas och publiceras.';\n}\n\nfunction cboAdminTourActivateEvent(id,name,year,startDate=null){\n  CBO_TOUR_ADMIN_ACTIVE_EVENT_ID=id?String(id):null;\n  CBO_TOUR_ADMIN_ACTIVE_EVENT_NAME=name||null;\n  CBO_TOUR_ADMIN_ACTIVE_EVENT_YEAR=Number(year)||null;\n  CBO_TOUR_ADMIN_ROUND_DRAFT=null;\n  const wrap=document.getElementById('onTourRoundDraftFields');\n  if(!CBO_TOUR_ADMIN_ACTIVE_EVENT_ID){wrap?.classList.add('hidden');return;}\n  wrap?.classList.remove('hidden');\n  const label=document.getElementById('onTourRoundEventLabel');\n  if(label)label.textContent=`${CBO_TOUR_ADMIN_ACTIVE_EVENT_NAME||'On Tour-event'}${CBO_TOUR_ADMIN_ACTIVE_EVENT_YEAR?` · ${CBO_TOUR_ADMIN_ACTIVE_EVENT_YEAR}`:''}`;\n  const roundNo=document.getElementById('onTourRoundNo');\n  if(roundNo)roundNo.value='1';\n  const roundDate=document.getElementById('onTourRoundDate');\n  if(roundDate)roundDate.value=startDate||'';\n  const title=document.getElementById('onTourRoundTitle');\n  if(title)title.value='';\n  const course=document.getElementById('onTourRoundCourse');\n  if(course)course.value='';\n  const holes=document.getElementById('onTourRoundHoles');\n  if(holes)holes.value='18';\n  const type=document.getElementById('onTourRoundType');\n  if(type)type.value='individual';\n  const metric=document.getElementById('onTourPrimaryMetric');\n  if(metric)metric.value='';\n  cboAdminTourRoundTypeChanged('individual');\n  const status=document.getElementById('onTourRoundStatus');\n  if(status)status.innerHTML='<strong>Runda 1 kan nu förberedas.</strong><br>Fyll i rundans uppgifter. Ingen rundpost skapas ännu.';\n}\n\nfunction cboAdminTourRoundTypeChanged(value){\n  const individual=value==='individual';\n  document.getElementById('onTourPrimaryMetricWrap')?.classList.toggle('hidden',!individual);\n  if(!individual){const metric=document.getElementById('onTourPrimaryMetric');if(metric)metric.value='';}\n}\n\nfunction cboAdminPrepareTourRound(){\n  const status=document.getElementById('onTourRoundStatus');\n  if(!CBO_TOUR_ADMIN_ACTIVE_EVENT_ID){if(status)status.innerHTML='<strong>Skapa eller välj event först.</strong>';return;}\n  const roundNo=Number(document.getElementById('onTourRoundNo')?.value);\n  const playedOn=document.getElementById('onTourRoundDate')?.value||'';\n  const course=(document.getElementById('onTourRoundCourse')?.value||'').trim();\n  const holes=Number(document.getElementById('onTourRoundHoles')?.value);\n  const roundType=document.getElementById('onTourRoundType')?.value||'individual';\n  const primaryMetric=document.getElementById('onTourPrimaryMetric')?.value||null;\n  const title=(document.getElementById('onTourRoundTitle')?.value||'').trim()||null;\n  if(!Number.isInteger(roundNo)||roundNo<1){if(status)status.innerHTML='<strong>Kontrollera rundnumret.</strong>';return;}\n  if(!playedOn){if(status)status.innerHTML='<strong>Datum saknas.</strong>';return;}\n  if(CBO_TOUR_ADMIN_ACTIVE_EVENT_YEAR&&Number(playedOn.slice(0,4))!==CBO_TOUR_ADMIN_ACTIVE_EVENT_YEAR){if(status)status.innerHTML='<strong>Rundans datum måste ligga samma år som eventet.</strong>';return;}\n  if(!course){if(status)status.innerHTML='<strong>Bana saknas.</strong>';return;}\n  if(![9,18].includes(holes)){if(status)status.innerHTML='<strong>Antal hål måste vara 9 eller 18.</strong>';return;}\n  if(!['individual','scramble','team','other'].includes(roundType)){if(status)status.innerHTML='<strong>Ogiltig rondtyp.</strong>';return;}\n  if(roundType==='individual'&&!['stroke_net','stableford_net','stroke_scr','stableford_scr'].includes(primaryMetric)){if(status)status.innerHTML='<strong>Välj primär tävlingsform.</strong>';return;}\n  CBO_TOUR_ADMIN_ROUND_DRAFT={event_id:CBO_TOUR_ADMIN_ACTIVE_EVENT_ID,round_no:roundNo,title,played_on:playedOn,course,holes,round_type:roundType,primary_metric:roundType==='individual'?primaryMetric:null};\n  const metricLabel={stroke_net:'Slagspel NET',stableford_net:'Poängbogey NET',stroke_scr:'Slagspel SCR',stableford_scr:'Poängbogey SCR'}[primaryMetric]||'';\n  if(status)status.innerHTML=`<strong>Runda ${roundNo} förberedd ✓</strong><br>${playedOn} · ${course} · ${holes} hål${metricLabel?` · ${metricLabel}`:''}. Nästa steg är GameBook-bilder och granskning.`;\n}\n'''
          if s.count(helper_marker)!=1:
              raise SystemExit('On Tour helper marker missing or duplicated. No change made.')
          s=s.replace(helper_marker,helper_replacement,1)

          mode_old='''  CBO_TOUR_ADMIN_ACTIVE_EVENT_ID=null;\n  if(mode==='existing'){'''
          mode_new='''  CBO_TOUR_ADMIN_ACTIVE_EVENT_ID=null;\n  CBO_TOUR_ADMIN_ACTIVE_EVENT_NAME=null;\n  CBO_TOUR_ADMIN_ACTIVE_EVENT_YEAR=null;\n  cboAdminTourResetRoundDraft();\n  if(mode==='existing'){'''
          if s.count(mode_old)!=1:
              raise SystemExit('Event mode state marker missing. No change made.')
          s=s.replace(mode_old,mode_new,1)

          option_old="""    rows.forEach(e=>{const opt=document.createElement('option');opt.value=String(e.id||'');opt.textContent=`${e.name||'On Tour-event'}${e.event_year?` · ${e.event_year}`:''}`;select.appendChild(opt);});"""
          option_new="""    rows.forEach(e=>{const opt=document.createElement('option');opt.value=String(e.id||'');opt.dataset.name=e.name||'On Tour-event';opt.dataset.year=String(e.event_year||'');opt.dataset.start=e.starts_on||'';opt.textContent=`${e.name||'On Tour-event'}${e.event_year?` · ${e.event_year}`:''}`;select.appendChild(opt);});\n    select.onchange=()=>{const opt=select.selectedOptions?.[0];if(!opt?.value){cboAdminTourResetRoundDraft();CBO_TOUR_ADMIN_ACTIVE_EVENT_ID=null;return;}cboAdminTourActivateEvent(opt.value,opt.dataset.name,Number(opt.dataset.year)||null,opt.dataset.start||null);cboAdminTourSetStatus(`<strong>Befintligt event valt ✓</strong><br>${opt.dataset.name}${opt.dataset.year?` · ${opt.dataset.year}`:''}. Lägg bara till en runda här om den hör till samma event.`);};"""
          if s.count(option_old)!=1:
              raise SystemExit('Event option marker missing. No change made.')
          s=s.replace(option_old,option_new,1)

          created_old='''    CBO_TOUR_ADMIN_ACTIVE_EVENT_ID=String(data.event_id||'');\n    CBO_TOUR_ADMIN_EVENTS_LOADED=false;\n    cboAdminTourSetStatus(`<strong>Event skapat ✓</strong><br>${name} · ${year}. Nästa steg är att skapa Runda 1 under detta event.`);'''
          created_new='''    CBO_TOUR_ADMIN_EVENTS_LOADED=false;\n    cboAdminTourActivateEvent(String(data.event_id||''),name,year,starts);\n    cboAdminTourSetStatus(`<strong>Event skapat ✓</strong><br>${name} · ${year}. Fyll nu i Runda 1 nedan.`);'''
          if s.count(created_old)!=1:
              raise SystemExit('Create-event success marker missing. No change made.')
          s=s.replace(created_old,created_new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit isolated On Tour round draft flow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add future On Tour round draft flow"
          git push origin HEAD:main
