<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b2d">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>CBO – On Tour preview</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--g:#123b2d;--cream:#f2ead9;--paper:#fffaf0;--ink:#273129;--muted:#716b60;--line:#d8c9aa;--tour:#2c7773;--tour2:#dcefed;--gold:#b6924a;--danger:#842029}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:var(--ink)}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(rgba(242,234,217,.9),rgba(242,234,217,.96)),url('https://images.unsplash.com/photo-1593111774240-d529f12cf4bb?auto=format&fit=crop&w=1400&q=72') center/cover fixed no-repeat}.app{max-width:620px;margin:auto;min-height:100vh;background:rgba(246,240,226,.76);padding-bottom:30px;box-shadow:0 0 45px #0002}.hero{padding:22px 18px 18px;color:#fff;background:linear-gradient(180deg,rgba(17,80,76,.45),rgba(20,67,54,.9)),url('https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?auto=format&fit=crop&w=1600&q=82') center 55%/cover no-repeat;border-bottom:3px solid var(--gold)}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:900}.hero h1,.card h2,.round-title{font-family:Futura,"Century Gothic","Avenir Next",Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em}.hero h1{margin:5px 0 6px;font-size:28px}.hero p{margin:0;font-family:Georgia,"Times New Roman",serif;font-style:italic;line-height:1.4}.content{padding:14px}.card{background:rgba(255,250,240,.94);border:1px solid #bca87966;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 8px 20px #40351e12}.card h2{font-size:16px;margin:0 0 10px}.hidden{display:none!important}.sub{font-size:12px;color:var(--muted);line-height:1.45}.notice{font-size:12px;background:#e8efe6;border-radius:11px;padding:10px;line-height:1.45}.err{color:var(--danger);font-weight:850}.ok{color:#17643a;font-weight:850}label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin:9px 0 5px;text-transform:uppercase}input{width:100%;border:1px solid #c9b88e;border-radius:11px;padding:11px;background:#fffaf0;font-size:15px}.btn{width:100%;padding:12px;border-radius:11px;font-weight:850;font-size:14px;margin-top:10px;cursor:pointer}.primary{background:var(--tour);color:#fff;border:1px solid #205e5a}.secondary{background:#fffaf0;color:var(--g);border:1px solid var(--g)}.event{border:1px solid #c9d9d6;background:linear-gradient(135deg,#f7fbfa,#fffaf0);border-radius:15px;padding:13px;margin-top:10px;cursor:pointer}.event:first-child{margin-top:0}.event-head{display:flex;align-items:flex-start;gap:10px}.event-main{min-width:0;flex:1}.event-name{font-size:17px;font-weight:900;color:var(--g)}.event-meta{font-size:11px;color:var(--muted);margin-top:3px}.tour-badge{background:var(--tour2);color:#165d59;border:1px solid #9fc9c4;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;white-space:nowrap}.winner{margin-top:9px;padding-top:9px;border-top:1px solid #d9e3df;font-size:13px}.winner strong{color:#6d5316}.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--g);font-weight:900;padding:0 0 10px;cursor:pointer}.event-hero{border-left:5px solid var(--tour)}.event-title{font-size:21px;font-weight:950}.event-nav{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.event-nav::-webkit-scrollbar{display:none}.event-nav button{flex:0 0 auto;border:1px solid #b9cbc6;background:#edf5f3;color:#1e615d;border-radius:999px;padding:9px 12px;font-size:11px;font-weight:900;white-space:nowrap;cursor:pointer}.event-nav button.active{background:var(--tour);color:#fff;border-color:var(--tour)}.total-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:5px}.total-title{font-family:Futura,"Century Gothic","Avenir Next",Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:15px;font-weight:900}.total-rule{font-size:10px;color:var(--muted);text-align:right}.total-row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #ece4d7}.total-row:first-of-type{border-top:0}.total-row.winner-row{background:linear-gradient(90deg,#fff7d6aa,transparent);margin:0 -7px;padding-left:7px;padding-right:7px;border-radius:10px}.total-score{text-align:right;font-weight:950}.total-rounds{font-size:10px;color:var(--muted);margin-top:2px}.round{border:1px solid #d8d0c1;border-radius:15px;overflow:hidden;background:#fffdf8}.round-head{padding:12px;background:#f0ece2}.round-title{font-size:14px;font-weight:900}.round-meta{font-size:11px;color:var(--muted);margin-top:3px}.round-win{margin-top:6px;font-size:12px;font-weight:850;color:#6d5316}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 10px 0}.tab{border:1px solid #b9cbc6;background:#edf5f3;color:#1e615d;border-radius:999px;padding:7px 9px;font-size:10px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.active{background:var(--tour);color:#fff;border-color:var(--tour)}.results{padding:6px 10px 10px}.result-row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #ece4d7}.result-row:first-child{border-top:0}.rank{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#ece7dc;font-size:11px;font-weight:900}.rank.gold{background:#c7a44d;color:#fff}.rank.silver{background:#abb0b1;color:#fff}.rank.bronze{background:#a66c40;color:#fff}.rname{font-weight:800}.rsub{font-size:10px;color:var(--muted);margin-top:2px}.rval{text-align:right;font-weight:950}.rto{font-size:10px;color:var(--muted);margin-top:2px}.empty{padding:18px 4px;text-align:center;color:var(--muted)}@media(min-width:700px){body{padding:22px}.app{border-radius:24px;overflow:hidden;min-height:900px}}
</style>
</head>
<body>
<div class="app">
  <div class="hero"><div class="eyebrow">CBO · dold utvecklingsvy</div><h1>On Tour</h1><p>Golfresor och tävlingar utanför ordinarie CBO-serie.</p></div>
  <div class="content">
    <div id="authCard" class="card"><h2>Åtkomst</h2><div id="authStatus" class="notice">Kontrollerar medlem…</div></div>
    <div id="loginCard" class="card hidden"><h2>Logga in</h2><label>Golf-ID</label><input id="golf" inputmode="numeric" autocomplete="username" placeholder="XXXXXX-XXX"><label>Personlig CBO-kod</label><input id="code" type="password" autocomplete="current-password"><button id="loginBtn" class="btn primary">Logga in</button><div id="loginErr" class="notice hidden"></div></div>
    <div id="feedView" class="hidden"><div class="card"><h2>Historiska event</h2><div class="sub">Endast läsning. On Tour påverkar inte CBO-poäng, närvaro, statistik eller leaderboard.</div><div id="events" style="margin-top:10px"></div></div></div>
    <div id="detailView" class="hidden"><button id="backBtn" class="back">← Alla event</button><div id="detail"></div></div>
  </div>
</div>
<script>
let sb,feed=[]; const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const metricLabel=m=>({stroke_net:'Slagspel NET',stableford_net:'Poängbogey NET',stroke_scr:'Slagspel SCR',stableford_scr:'Poängbogey SCR'})[m]||m||'Resultat';
const fmtDate=d=>{if(!d)return 'Datum saknas'; const [y,m,day]=String(d).split('-'); return `${Number(day)}.${Number(m)}.${y}`};
const ng=v=>String(v||'').replace(/\D/g,'').slice(0,9);
function showLogin(msg='Logga in nedan.'){$('authStatus').textContent=msg;$('loginCard').classList.remove('hidden');$('feedView').classList.add('hidden');$('detailView').classList.add('hidden')}
async function member(){const {data,error}=await sb.rpc('cbo_current_player'); if(error)throw error; const p=Array.isArray(data)?data[0]:data; if(!p?.player_id)throw new Error('Aktivt CBO-medlemskap krävs.'); return p}
async function loadFeed(){const {data,error}=await sb.rpc('cbo_tour_events_feed'); if(error)throw error; feed=data||[]; $('events').innerHTML=feed.length?feed.map(e=>`<div class="event" data-id="${esc(e.id)}"><div class="event-head"><div class="event-main"><div class="event-name">${esc(e.name)}</div><div class="event-meta">${esc(e.event_year)} · ${esc(e.location||'')} · ${esc(e.round_count)} rundor</div></div><div class="tour-badge">ON TOUR</div></div><div class="winner">🏆 <strong>${esc(e.winner_name||'Vinnare saknas')}</strong></div></div>`).join(''):'<div class="empty">Inga On Tour-event hittades.</div>'; document.querySelectorAll('.event').forEach(el=>el.onclick=()=>openEvent(el.dataset.id))}
async function verify(){const p=await member(); $('authStatus').innerHTML=`<span class="ok">✓ Medlem verifierad: ${esc(p.name||'')}</span>`; $('loginCard').classList.add('hidden'); await loadFeed(); $('feedView').classList.remove('hidden')}
async function boot(){sb=window.supabase.createClient(window.CBO_SUPABASE_URL,window.CBO_SUPABASE_PUBLISHABLE_KEY); const {data:{session}}=await sb.auth.getSession(); if(!session){showLogin();return} try{await verify()}catch(e){showLogin(e.message||String(e))}}
$('loginBtn').onclick=async()=>{try{const g=ng($('golf').value),c=$('code').value||''; if(g.length!==9||c.length<8)throw new Error('Kontrollera Golf-ID och CBO-kod.'); const {error}=await sb.auth.signInWithPassword({email:`${g}@cbo.local`,password:c}); if(error)throw new Error('Fel Golf-ID eller CBO-kod.'); $('loginErr').classList.add('hidden'); await verify(); $('code').value=''}catch(e){$('loginErr').innerHTML=`<span class="err">${esc(e.message||e)}</span>`;$('loginErr').classList.remove('hidden')}};
$('backBtn').onclick=()=>{$('detailView').classList.add('hidden');$('feedView').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};
function resultValue(r,m){if(r.result_value==null)return '—'; return m.startsWith('stableford')?`${r.result_value} p`:String(r.result_value)}
function rankClass(pos){return pos===1?'gold':pos===2?'silver':pos===3?'bronze':''}
function primaryScoreForRound(r){
 const metric=r.primary_metric; if(!metric)return new Map();
 const rows=(r.results||[]).filter(x=>x.metric===metric&&x.result_value!=null);
 const byName=new Map();
 for(const x of rows){const name=String(x.participant_name||'').trim();if(!name)continue;if(!byName.has(name))byName.set(name,[]);byName.get(name).push(x)}
 const out=new Map();
 for(const [name,list] of byName){
   const full=list.find(x=>(x.segment||'full')==='full');
   if(full){out.set(name,{value:Number(full.result_value),complete:true});continue}
   const first=list.find(x=>x.segment==='first9'),last=list.find(x=>x.segment==='last9');
   if(first&&last){out.set(name,{value:Number(first.result_value)+Number(last.result_value),complete:true});continue}
   const one=first||last||list[0]; if(one)out.set(name,{value:Number(one.result_value),complete:false});
 }
 return out;
}
function eventTotals(e){
 const rounds=(e.rounds||[]).filter(r=>r.primary_metric);
 if(!rounds.length)return {rows:[],rounds:0,direction:null,label:'Resultat'};
 const families=[...new Set(rounds.map(r=>String(r.primary_metric).startsWith('stableford')?'stableford':'stroke'))];
 if(families.length!==1)return {rows:[],rounds:rounds.length,direction:null,label:'Blandade tävlingsformer'};
 const direction=families[0]==='stableford'?'desc':'asc';
 const map=new Map();
 rounds.forEach(r=>{const scores=primaryScoreForRound(r);for(const [name,s] of scores){if(!map.has(name))map.set(name,{name,total:0,rounds:0,complete:true});const p=map.get(name);p.total+=s.value;p.rounds++;p.complete=p.complete&&s.complete}});
 let rows=[...map.values()].map(p=>({...p,complete:p.complete&&p.rounds===rounds.length}));
 rows.sort((a,b)=>{if(a.complete!==b.complete)return a.complete?-1:1;if(a.complete&&b.complete){const d=direction==='asc'?a.total-b.total:b.total-a.total;if(d)return d;const aw=a.name===e.winner_name,bw=b.name===e.winner_name;if(aw!==bw)return aw?-1:1}return a.name.localeCompare(b.name,'sv')});
 let last=null,lastRank=0;rows.forEach((p,i)=>{if(!p.complete){p.rank=null;return}if(i===0){p.rank=1;last=p.total;lastRank=1;return}const same=p.total===last;if(same&&!(p.name===e.winner_name||rows[i-1]?.name===e.winner_name)){p.rank=lastRank}else{p.rank=i+1;lastRank=p.rank}last=p.total});
 return {rows,rounds:rounds.length,direction,label:families[0]==='stableford'?'Poängbogey total':'Nettoslag total'};
}
function totalBlock(e){const t=eventTotals(e);if(!t.rows.length)return `<div class="card"><div class="empty">Totalställning kan inte beräknas säkert för detta event.</div></div>`;const rule=t.direction==='asc'?'Lägst totalsumma vinner':'Högst totalsumma vinner';return `<div class="card"><div class="total-head"><div><div class="total-title">Totalställning</div><div class="sub">${esc(t.label)}</div></div><div class="total-rule">${esc(rule)}<br>${t.rounds} rundor</div></div>${t.rows.map(p=>`<div class="total-row ${p.name===e.winner_name?'winner-row':''}"><div class="rank ${rankClass(p.rank)}">${p.rank??'–'}</div><div><div class="rname">${p.name===e.winner_name?'🏆 ':''}${esc(p.name)}</div><div class="total-rounds">${p.rounds}/${t.rounds} rundor${p.complete?'':' · ej komplett'}</div></div><div class="total-score">${esc(p.total)}${t.direction==='desc'?' p':''}</div></div>`).join('')}</div>`}
function roundBlock(r){const metrics=[...new Set((r.results||[]).map(x=>x.metric).filter(Boolean))]; const active=r.primary_metric&&metrics.includes(r.primary_metric)?r.primary_metric:metrics[0]; const id='r'+String(r.id).replace(/-/g,''); const tabs=metrics.map(m=>`<button class="tab ${m===active?'active':''}" data-round="${id}" data-metric="${esc(m)}">${esc(metricLabel(m))}</button>`).join(''); const datasets={}; metrics.forEach(m=>datasets[m]=(r.results||[]).filter(x=>x.metric===m)); const encoded=esc(JSON.stringify(datasets)); return `<div class="round" id="${id}" data-results="${encoded}" data-primary="${esc(active||'')}"><div class="round-head"><div class="round-title">R${esc(r.round_no)} · ${esc(r.title||r.course||'Runda')}</div><div class="round-meta">${esc(fmtDate(r.played_on))} · ${esc(r.course||'Bana saknas')} · ${esc(r.holes||'—')} hål · ${esc(metricLabel(r.primary_metric))}</div>${r.winner?.name?`<div class="round-win">🏆 ${esc(r.winner.name)} · ${esc(r.winner.result_value)}</div>`:''}</div><div class="tabs">${tabs}</div><div class="results"></div></div>`}
function renderMetric(roundEl,m){let rows=[]; try{rows=JSON.parse(roundEl.dataset.results||'{}')[m]||[]}catch(_){rows=[]} const box=roundEl.querySelector('.results'); if(!rows.length){box.innerHTML='<div class="empty">Inga resultat.</div>';return} box.innerHTML=rows.map((r,i)=>`<div class="result-row"><div class="rank ${rankClass(r.displayed_position??(i+1))}">${esc(r.displayed_position??(i+1))}</div><div><div class="rname">${esc(r.participant_name)}</div><div class="rsub">${r.displayed_hcp!=null?`HCP ${esc(r.displayed_hcp)}`:''}${r.segment&&r.segment!=='full'?` · ${esc(r.segment)}`:''}</div></div><div><div class="rval">${esc(resultValue(r,m))}</div><div class="rto">${r.to_par==null?'':(r.to_par===0?'E':r.to_par>0?`+${r.to_par}`:r.to_par)}</div></div></div>`).join('')}
function bindRoundTabs(){document.querySelectorAll('.round').forEach(el=>renderMetric(el,el.dataset.primary));document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{const roundEl=document.getElementById(btn.dataset.round);roundEl.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderMetric(roundEl,btn.dataset.metric)})}
function renderEventSection(e,key){document.querySelectorAll('.event-nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===key));const box=$('eventSection');if(key==='total'){box.innerHTML=totalBlock(e);return}const no=Number(key.replace('r',''));const r=(e.rounds||[]).find(x=>Number(x.round_no)===no);box.innerHTML=r?roundBlock(r):'<div class="card"><div class="empty">Rundan saknas.</div></div>';bindRoundTabs()}
async function openEvent(id){$('feedView').classList.add('hidden');$('detailView').classList.remove('hidden');$('detail').innerHTML='<div class="card"><div class="notice">Laddar event…</div></div>'; window.scrollTo({top:0,behavior:'smooth'}); try{const {data,error}=await sb.rpc('cbo_tour_event_detail',{p_event_id:id}); if(error)throw error; if(!data?.ok)throw new Error(data?.error||'Eventet kunde inte läsas.'); const e=data.event; const nav=[`<button class="active" data-view="total">Totalen</button>`,...(e.rounds||[]).map(r=>`<button data-view="r${esc(r.round_no)}">R${esc(r.round_no)}</button>`)]; $('detail').innerHTML=`<div class="card event-hero"><div class="eyebrow" style="color:var(--tour)">${esc(e.event_year)} · ON TOUR</div><div class="event-title">${esc(e.name)}</div><div class="sub" style="margin-top:5px">${esc(e.location||'')} · ${esc(fmtDate(e.starts_on))}${e.ends_on&&e.ends_on!==e.starts_on?` – ${esc(fmtDate(e.ends_on))}`:''}</div><div class="winner">🏆 Eventvinnare: <strong>${esc(e.winner_name||'—')}</strong></div></div><div class="event-nav">${nav.join('')}</div><div id="eventSection"></div>`;document.querySelectorAll('.event-nav button').forEach(b=>b.onclick=()=>renderEventSection(e,b.dataset.view));renderEventSection(e,'total')}catch(e){$('detail').innerHTML=`<div class="card"><div class="notice err">${esc(e.message||e)}</div></div>`}}
boot();
</script>
</body>
</html>
