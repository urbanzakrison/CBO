<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b2d">
<title>CBO – On Tour</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f2ead9;color:#273129}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot strong{display:block;font-size:20px;margin-bottom:8px}.boot span{font-size:13px;color:#716b60}
</style>
</head>
<body>
<div class="boot"><div><strong>On Tour</strong><span>Laddar CBO On Tour…</span></div></div>
<script>
(async()=>{
  try{
    const r=await fetch('./on-tour-preview.html',{cache:'no-store'});
    if(!r.ok) throw new Error('Kunde inte läsa On Tour.');
    let html=await r.text();
    html=html
      .replace('<title>CBO – On Tour preview</title>','<title>CBO – On Tour</title>')
      .replace('CBO · dold utvecklingsvy','CBO · ON TOUR');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="boot"><div><strong>On Tour kunde inte öppnas</strong><span>Försök igen om en stund.</span></div></div>';
  }
})();
</script>
</body>
</html>
